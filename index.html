    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            950: '#050a17',
                            900: '#0a1128',
                            800: '#0c1838',
                            700: '#111d4a',
                            600: '#1a2b63',
                        },
                        gold: {
                            300: '#ffe875',
                            400: '#f3c64f',
                            500: '#ffd700',
                            600: '#dfa010',
                            700: '#b88209',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050a17;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Glassmorphism Panels */
        .glass-panel-navy {
            background: rgba(12, 24, 56, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 8px 32px 0 rgba(5, 10, 23, 0.6);
        }

        .glass-panel-hover {
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel-hover:hover {
            background: rgba(17, 29, 74, 0.85);
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(255, 215, 0, 0.18);
        }

        .glass-nav {
            background: rgba(10, 17, 40, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        /* Gradient Gold Text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #ffe875 0%, #ffd700 40%, #dfa010 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #ffd700 0%, #dfa010 100%);
        }

        .gold-gradient-bg-hover:hover {
            background: linear-gradient(135deg, #ffe875 0%, #ffd700 100%);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050a17;
        }
        ::-webkit-scrollbar-thumb {
            background: #111d4a;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1a2b63;
        }

        /* Page View Switcher Styling */
        .page-view {
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .page-view.hidden-view {
            display: none !important;
            opacity: 0;
            pointer-events: none;
        }

        /* Fullscreen Transition Overlay Canvas */
        #transition-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }
    </style>
</head>
