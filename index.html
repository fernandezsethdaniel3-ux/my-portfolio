<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seth, Daniel M. Fernandez | Visual Portfolio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        heading: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            950: '#050a17',
                            900: '#0a1128',
                            800: '#0c1838',
                            700: '#111d4a',
                            600: '#1a2b63',
                        },
                        gold: {
                            300: '#ffe875',
                            400: '#f3c64f',
                            500: '#ffd700',
                            600: '#dfa010',
                            700: '#b88209',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-12px)' },
                        },
                        glow: {
                            '0%': { filter: 'drop-shadow(0 0 10px rgba(255, 215, 0, 0.3))' },
                            '100%': { filter: 'drop-shadow(0 0 25px rgba(255, 215, 0, 0.7))' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #050a17;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Glassmorphism Panels */
        .glass-panel-navy {
            background: rgba(12, 24, 56, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            box-shadow: 0 8px 32px 0 rgba(5, 10, 23, 0.6);
        }

        .glass-panel-hover {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel-hover:hover {
            background: rgba(17, 29, 74, 0.75);
            border-color: rgba(255, 215, 0, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px 0 rgba(255, 215, 0, 0.15);
        }

        .glass-nav {
            background: rgba(10, 17, 40, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 215, 0, 0.15);
        }

        /* Gradient Gold Text & Backgrounds */
        .gold-gradient-text {
            background: linear-gradient(135deg, #ffe875 0%, #ffd700 40%, #dfa010 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-gradient-bg {
            background: linear-gradient(135deg, #ffd700 0%, #dfa010 100%);
        }

        .gold-gradient-bg-hover:hover {
            background: linear-gradient(135deg, #ffe875 0%, #ffd700 100%);
        }

        /* View Section Page Motion Classes */
        .view-section {
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1;
            transform: translateY(0px) scale(1);
        }
        .view-exit {
            opacity: 0 !important;
            transform: translateY(-20px) scale(0.98) !important;
            pointer-events: none;
        }
        .view-enter-start {
            opacity: 0 !important;
            transform: translateY(35px) scale(0.97) !important;
        }
        .view-hidden {
            display: none !important;
        }

        /* Wave Canvas Overlay */
        #transition-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050a17;
        }
        ::-webkit-scrollbar-thumb {
            background: #111d4a;
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #1a2b63;
        }
    </style>
</head>
<body class="font-sans antialiased selection:bg-gold-500 selection:text-navy-950">

    <canvas id="hexagon-canvas" class="fixed top-0 left-0 w-full h-full pointer-events-none z-0"></canvas>

    <!-- Transition Canvas Overlay -->
    <canvas id="transition-canvas"></canvas>

    <!-- Ambient Glow Orbs -->
    <div class="fixed top-1/4 -left-32 w-96 h-96 rounded-full pointer-events-none z-0 animate-pulse-slow" style="background: radial-gradient(circle, rgba(255, 215, 0, 0.12) 0%, rgba(5, 10, 23, 0) 70%);"></div>
    <div class="fixed bottom-1/4 -right-32 w-96 h-96 rounded-full pointer-events-none z-0 animate-pulse-slow" style="background: radial-gradient(circle, rgba(17, 29, 74, 0.5) 0%, rgba(5, 10, 23, 0) 70%);"></div>

    <!-- HEADER / NAVIGATION BAR -->
    <header class="fixed top-0 left-0 w-full z-50 glass-nav">

                    </div>
                    <div class="flex flex-col">

                <!-- Nav Links -->
                <nav class="hidden md:flex items-center space-x-3">

                        <i class="fa-solid fa-house-chimney text-xs"></i>
                        <span>Home Page</span>
                    </button>
                    <button id="nav-btn-personal" onclick="triggerSequenceTransition(event, 'personal')" class="px-5 py-2.5 rounded-xl text-sm font-medium text-slate-300 border border-gold-500/20 hover:border-gold-500/60 hover:text-gold-400 hover:bg-navy-800/50 transition-all flex items-center gap-2">
                        <i class="fa-regular fa-user text-xs"></i>
                        <span>Personal Info</span>
                    </button>
                </nav>

                <!-- Mobile Menu Toggle -->
                <button id="mobile-menu-btn" aria-label="Toggle Navigation" class="md:hidden p-2.5 rounded-xl border border-gold-500/20 text-slate-300 hover:text-gold-400 hover:bg-navy-800/50">
                    <i class="fa-solid fa-bars text-xl" id="menu-icon"></i>
                </button>
            </div>
        </div>

        <!-- Mobile Dropdown -->
        <div id="mobile-menu" class="hidden md:hidden glass-panel-navy border-t border-gold-500/20 px-4 pt-3 pb-6 space-y-3">
            <button onclick="triggerSequenceTransition(event, 'home')" class="w-full mobile-link flex items-center gap-3 px-4 py-3 rounded-xl text-base font-semibold text-navy-9
