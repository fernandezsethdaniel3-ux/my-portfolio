<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Easter College — Certificates Carousel</title>
  <style>
    :root {
      --ec-green-dark: #14532d;
      --ec-green: #166534;
      --ec-green-soft: #f0fdf4;
      --ec-border: #bbf7d0;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --bg-page: #f8fafc;
      --bg-card: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-page);
      color: var(--text-main);
      padding: 2rem 1rem;
    }

    .easter-college-section {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-card);
      border: 1px solid var(--ec-border);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 28px rgba(20, 83, 45, 0.08);
    }

    .ec-header {
      border-bottom: 2px solid var(--ec-green-soft);
      padding-bottom: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .ec-badge {
      display: inline-block;
      background: var(--ec-green-soft);
      color: var(--ec-green);
      border: 1px solid var(--ec-border);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.5rem;
    }

    .ec-header h2 {
      font-size: 1.5rem;
      color: var(--ec-green-dark);
    }

    .ec-header p {
      margin-top: 0.35rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Carousel Styles */
    .ec-cert-carousel {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .ec-cert-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.85rem;
    }

    .ec-cert-frame {
      flex: 1;
      max-width: 680px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 0.85rem;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    .ec-cert-frame img {
      display: block;
      width: 100%;
      height: 430px;
      object-fit: contain; /* Shows full certificate without cutting off edges */
      background: #f9fafb;
      border-radius: 8px;
      transition: opacity 0.2s ease;
    }

    .ec-cert-frame figcaption {
      margin-top: 0.7rem;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .ec-cert-meta {
      margin-top: 0.2rem;
      font-size: 0.82rem;
      color: var(--text-muted);
      word-break: break-word;
    }

    .ec-cert-btn {
      flex: 0 0 auto;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 999px;
      background: var(--ec-green-dark);
      color: #ffffff;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .ec-cert-btn:hover {
      background: var(--ec-green);
      transform: scale(1.06);
    }

    .ec-cert-btn:active {
      transform: scale(0.96);
    }

    .ec-cert-btn:focus-visible {
      outline: 3px solid #86efac;
      outline-offset: 2px;
    }

    .ec-cert-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    @media (max-width: 600px) {
      .easter-college-section {
        padding: 1.1rem;
      }

      .ec-cert-stage {
        gap: 0.45rem;
      }

      .ec-cert-btn {
        width: 36px;
        height: 36px;
        font-size: 1.3rem;
      }

      .ec-cert-frame img {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <section class="easter-college-section" id="easter-college" aria-labelledby="ecHeading">
    <header class="ec-header">
      <span class="ec-badge">Easter College Incorporated</span>
      <h2 id="ecHeading">HP LIFE Certificates of Completion</h2>
      <p>Use Previous or Next to view one certificate at a time without cropping.</p>
    </header>

    <div class="ec-cert-carousel" aria-label="Easter College HP LIFE Certificates Carousel">
      <div class="ec-cert-stage">
        <button type="button" class="ec-cert-btn prev-btn" aria-label="Previous certificate">&lsaquo;</button>

        <figure class="ec-cert-frame">
          <img
            id="ecCertImage"
            src="03d06d67-7deb-43f6-9eb6-41c6d70d40d2.jpg"
            alt="HP LIFE Certificate of Completion: Success Mindset"
          />
          <figcaption id="ecCertCaption">Success Mindset</figcaption>
          <div id="ecCertMeta" class="ec-cert-meta"></div>
        </figure>

        <button type="button" class="ec-cert-btn next-btn" aria-label="Next certificate">&rsaquo;</button>
      </div>

      <div class="ec-cert-footer">
        <span id="ecCertCounter">1 / 5</span>
      </div>
    </div>
  </section>

  <script>
    const ecCertificates = [
      {
        src: "03d06d67-7deb-43f6-9eb6-41c6d70d40d2.jpg",
        title: "Success Mindset",
        issuer: "HP LIFE | HP Foundation",
        recipient: "Fernandez, Seth, Daniel M.",
        presented: "2/24/2026",
        serial: "bedcb7cc-0d02-4aec-b7cc-4f63d9e3d4a7"
      },
      {
        src: "c2ade337-bf20-48f4-8ca9-bf915d68d0d2.jpg",
        title: "Resume Writing and Job Interviewing",
        issuer: "HP LIFE | HP Foundation",
        recipient: "Fernandez, Seth, Daniel M.",
        presented: "2/24/2026",
        serial: "2fc82f87-9843-432f-9aad-d7f345413e1b"
      },
      {
        src: "cfb37508-c036-4ad1-b783-fc5dffa26ee7.jpg",
        title: "Effective Leadership",
        issuer: "HP LIFE | HP Foundation",
        recipient: "Fernandez, Seth, Daniel M.",
        presented: "2/24/2026",
        serial: "3dda5318-8bf7-49bf-9102-f5ece3e88faf"
      },
      {
        src: "a3f5c805-b4dc-4330-9a51-591eeec0345e.jpg",
        title: "Professional Networking for Career Growth",
        issuer: "HP LIFE | HP Foundation",
        recipient: "Fernandez, Seth, Daniel M.",
        presented: "2/24/2026",
        serial: "5685b227-2df4-4ccc-bdb6-66a4b74557b8"
      },
      {
        src: "d4ad1303-fa45-4e3c-97cf-b31a20ac25f4.jpg",
        title: "Effective Presentations",
        issuer: "HP LIFE | HP Foundation",
        recipient: "Fernandez, Seth, Daniel M.",
        presented: "2/24/2026",
        serial: "48aa0b15-64d8-439d-9201-6bb7d2789118"
      }
    ];

    let currentCertIndex = 0;

    const certImgEl = document.getElementById("ecCertImage");
    const certCaptionEl = document.getElementById("ecCertCaption");
    const certMetaEl = document.getElementById("ecCertMeta");
    const certCounterEl = document.getElementById("ecCertCounter");
    const prevCertBtn = document.querySelector(".ec-cert-carousel .prev-btn");
    const nextCertBtn = document.querySelector(".ec-cert-carousel .next-btn");

    function renderCertificate(index) {
      currentCertIndex = (index + ecCertificates.length) % ecCertificates.length;
      const cert = ecCertificates[currentCertIndex];

      certImgEl.style.opacity = "0.35";
      certImgEl.src = cert.src;
      certImgEl.alt = `${cert.issuer} Certificate of Completion: ${cert.title} for ${cert.recipient}`;
      certImgEl.onload = () => {
        certImgEl.style.opacity = "1";
      };

      certCaptionEl.textContent = cert.title;
      certMetaEl.textContent = `${cert.issuer} • Presented ${cert.presented} • Serial: ${cert.serial}`;
      certCounterEl.textContent = `${currentCertIndex + 1} / ${ecCertificates.length}`;
    }

    prevCertBtn.addEventListener("click", () => renderCertificate(currentCertIndex - 1));
    nextCertBtn.addEventListener("click", () => renderCertificate(currentCertIndex + 1));

    renderCertificate(0);
  </script>
</body>
</html>
